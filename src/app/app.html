<header class=" bg-white w-full overflow-hidden fixed top-0 left-0 z-2 p-4 flex flex-col md:flex-row md:justify-between md:items-center 
shadow-[0px_4px_6px_0px_rgba(0,_0,_0,_0.1)] transition-all duration-200" [class.h-16]="!estaAbierto()" [class.h-32]="estaAbierto()">

  <section class="flex gap-4 items-center justify-between">
    <a [routerLink]="'/'" class="flex gap-2 items-center" routerLink="/">
      <img class="size-10" src="assets/libro-de-recetas.webp" alt="Logo del sitio Mi Libro De Concina">
      <h1 class="text-2xl font-bold text-nowrap">Mi Libro De Cocina</h1>
    </a>

    <button (click)="estaAbierto.set(!estaAbierto())" class="block md:hidden text-3xl text-orange-400 cursor-pointer
    hover:scale-95 transition-transform duration-100" type="button">
      <i class="fa-solid fa-bars"></i>
    </button>
  </section>

  <div class="flex gap-2 items-center transition-transform duration-200 mt-6 md:static md:mt-0">

    <input class="border border-slate-400 rounded-md p-1 placeholder:text-slate-400 w-xs" 
    type="text" placeholder="Buscar receta...">

    <button class="bg-orange-400 rounded-md text-white font-semibold px-2 py-1
    hover:scale-95 transition-transform duration-100 cursor-pointer" 
    type="submit">Buscar</button>
  </div>
</header>

<section class="mt-16 p-4 z-1">
  <router-outlet />
</section>
