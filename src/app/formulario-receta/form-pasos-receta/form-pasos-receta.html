<div class="p-6 h-full border border-slate-300 rounded-2xl">
  <h3 class="text-lg font-bold">Paso a paso</h3>
  <p class="text-slate-500 text-sm">Describa el paso a paso de la receta</p>

  <div class="flex flex-col gap-2 [&>form>input]:shadow-[0px_0px_14px_-3px_rgba(0,_0,_0,_0.1)] [&>form>input]:border [&>form>input]:border-slate-200 [&>form>input]:p-2">
      <form [formGroup]="formGroup()" class="flex flex-col gap-3">

        <div formArrayName="pasos" class="flex flex-col gap-1">
          @for (paso of pasos().controls; track $index) {
            <div class="flex gap-2">
              <input class="placeholder:text-slate-400 grow" type="text" [formControlName]="$index" placeholder="Nuevo paso...">
              <button class="cursor-pointer font-bold hover:text-red-500" type="button" (click)="eliminarPaso($index)">Eliminar</button>
            </div>
          }
        </div>

        <button class="mx-40 py-1 px-2 bg-orange-400 text-white font-bold rounded-sm cursor-pointer" 
        type="button" (click)="agregarInputPaso()">
          Agregar paso
        </button>

      </form>
  </div>

</div>
