<div>
        <h3 class="text-lg font-bold">Paso a paso</h3>
        <p class="text-slate-500 text-sm">Describa el paso a paso de la receta</p>

        <div>
          <ul class="mt-4">
            @for (paso of pasos(); track $index) {
              <li class="bg-slate-200 p-3 rounded-lg mb-2 text-lg flex items-center">
                  <div class="grow">
                    {{$index + 1}}.- {{paso}}
                  </div>

                  <button (click)="eliminarPaso($index)" type="button" class="cursor-pointer hover:text-red-500">
                    <i class="fa-solid fa-xmark"></i>
                  </button>
              </li>
            }
          </ul>
        </div>

        <div class="flex flex-col gap-2 [&>form>input]:shadow-[0px_0px_14px_-3px_rgba(0,_0,_0,_0.1)] [&>form>input]:border [&>form>input]:border-slate-200 [&>form>input]:p-2">
          <form [formGroup]="formPasos">
            @if (mostrarInput()) {
              <input formControlName="paso" (keyup.enter)="guardarPaso()" (blur)="guardarPaso()" class="placeholder:text-slate-400 w-full" type="text" placeholder="Nuevo paso...">
            }
          </form>
          <button (click)="agregarPaso()" class="py-1 px-2 bg-orange-400 rounded-sm text-white font-semibold cursor-pointer" type="button">Nuevo paso <i class="fa-solid fa-plus"></i></button>
        </div>
      </div>
