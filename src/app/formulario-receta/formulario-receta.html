<section class="flex justify-center items-center">

  <form [formGroup]="formCrearReceta" class="w-full p-6 [&_div>label]:text-sm [&_div>label]:font-semibold [&_div>label]:mb-2
    [&_div>input]:shadow-[0px_0px_14px_-3px_rgba(0,_0,_0,_0.1)] [&_div>input]:border [&_div>input]:border-slate-200 [&_div>input]:p-2
    [&_div>select]:shadow-[0px_0px_14px_-3px_rgba(0,_0,_0,_0.1)] [&_div>select]:border [&_div>select]:border-slate-200 [&_div>select]:p-2">
    <h2 class="text-3xl font-bold">{{title()}}</h2>

    <div class="flex flex-col mt-4 [&>input]:mb-4">
      <label for="nombre">Nombre:</label>
      <input formControlName="nombre" class="placeholder:text-slate-400" type="text" placeholder="Ingresa el nombre de la receta">

      <label for="imagen">Url imagen:</label>
      <input formControlName="urlImagen" (blur)="imagenValida(imagenReceta.value)" #imagenReceta class="placeholder:text-slate-400" type="text" placeholder="Ingresa la dirección de la imagen">
      @if (existeImagen()) {
        <span>
          <img [src]="imagenReceta.value" width="300" height="400">
        </span>
      }

      <label for="descripcion">Descripción:</label>
      <textarea formControlName="descripcion" class="shadow-[0px_0px_14px_-3px_rgba(0,_0,_0,_0.1)] border border-slate-200 p-2" name="descripcion"></textarea>
    </div>

    <div class="flex mt-4 gap-2 [&>div]:flex [&>div]:flex-col [&>div]:grow">
      <div>
        <label for="difucultad">Dificultad</label>
        <select formControlName="dificultad" name="dificultad">
          <option value="" disabled selected>Selecciona una dificultad</option>
          <option value="facil">Fácil</option>
          <option value="media">Media</option>
          <option value="dificil">Difícil</option>
        </select>
      </div>

      <div>
        <label for="categoria">Categoria</label>
        <select formControlName="categoria" name="categoria">
          <option value="" disabled selected>Selecciona una categoria</option>
          <option value="facil">Desayuno</option>
          <option value="media">Almuerzo</option>
          <option value="dificil">Cena</option>
        </select>
      </div>

      <div>
        <label for="tiempo">Tiempo de preparación (minutos):</label>
        <input formControlName="tiempo" type="number">
      </div>
    </div>

    <app-form-ingrediente [formGroup]="formCrearReceta.controls.ingredientesReceta" />

    <div class="mt-4">
      <app-form-pasos-receta [formGroup]="formCrearReceta.controls.pasosReceta" />
    </div>

    <button (click)="mostrar()" type="submit">Crear</button>
  </form>

</section>
