<div  class="flex justify-center items-center gap-2 mt-4">
    <button (click)="cambiarPagina(paginaActual() - 1)" [disabled]="paginaActual() === 1"
    class="px-3 py-1 text-2xl enabled:cursor-pointer enabled:hover:text-orange-400 disabled:opacity-50">
      <i class="fa-solid fa-angle-left"></i>
    </button>

    
    <span>
      @for (page of numeroDePaginas(); track page) {
        <button 
          (click)="cambiarPagina(page)"
          [class.bg-orange-400]="paginaActual() === page"
          class="px-3 py-1 rounded-full cursor-pointer hover:bg-orange-300">
          {{ page }}
        </button>
      }
    </span>

    <button (click)="cambiarPagina(paginaActual() + 1)" [disabled]="paginaActual() === paginasTotales()"
      class="px-3 py-1 text-2xl enabled:cursor-pointer enabled:hover:text-orange-400 disabled:opacity-50">
      <i class="fa-solid fa-angle-right"></i>
    </button>
  </div>
